<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Henry Benton — Contact</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --ink: #1c2321;
    --paper: #f7f5f0;
    --accent: #2f5d50;
    --line: #d8d3c7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 32px 28px 28px;
    text-align: center;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .role {
    font-size: 14px;
    color: #6b6558;
    margin: 0 0 24px;
  }
  #qr {
    display: flex;
    justify-content: center;
    margin: 0 0 20px;
  }
  #qr img, #qr canvas {
    border: 8px solid #fff;
    outline: 1px solid var(--line);
  }
  .prompt {
    font-size: 13px;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 20px;
  }
  .details {
    text-align: left;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 13.5px;
    padding: 6px 0;
  }
  .row span:first-child {
    color: #8a8474;
  }
  .row span:last-child {
    text-align: right;
    word-break: break-word;
  }
  .row a {
    color: var(--ink);
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Henry Benton</h1>
    <p class="role">AI Consultancy</p>
    <div id="qr"></div>
    <p class="prompt">Scan to save my contact details</p>
    <div class="details">
      <div class="row"><span>Phone</span><span><a href="tel:+447584419392">07584 419392</a></span></div>
      <div class="row"><span>Email</span><span><a href="mailto:henrybentonai@gmail.com">henrybentonai@gmail.com</a></span></div>
      <div class="row"><span>Site</span><span><a href="https://henrybentonai.github.io/practical-tools-built-with-ai/">henrybentonai.github.io</a></span></div>
    </div>
  </div>

<script>
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Benton;Henry;;;",
    "FN:Henry Benton",
    "TEL;TYPE=CELL:+447584419392",
    "EMAIL:henrybentonai@gmail.com",
    "URL:https://henrybentonai.github.io/practical-tools-built-with-ai/",
    "END:VCARD"
  ].join("\n");

  new QRCode(document.getElementById("qr"), {
    text: vcard,
    width: 220,
    height: 220,
    colorDark: "#1c2321",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
</script>
</body>
</html>
