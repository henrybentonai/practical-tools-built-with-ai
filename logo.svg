<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Work+Sans:wght@400;500&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');

      .paper { fill: #F0ECE1; }
      .grid-line { stroke: #D9D2BC; stroke-width: 1; }
      .divider { stroke: #C6BEA6; stroke-width: 1; }
      .mark { font-family: 'IBM Plex Mono', monospace; font-weight: 500; fill: #22302B; }
      .qualifier { font-family: 'IBM Plex Mono', monospace; font-weight: 500; fill: #AD5A1E; }
      .word { font-family: 'Fraunces', serif; font-weight: 600; fill: #22302B; }
      .tagline { font-family: 'Work Sans', sans-serif; font-weight: 400; fill: #52605A; }
      .label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #52713A; }
    </style>
  </defs>

  <rect class="paper" width="960" height="460"/>

  <!-- outer frame, matching webpage backdrop -->
  <g>
    <line class="grid-line" x1="0" y1="46" x2="960" y2="46"/>
    <line class="grid-line" x1="0" y1="414" x2="960" y2="414"/>
    <line class="grid-line" x1="46" y1="0" x2="46" y2="460"/>
    <line class="grid-line" x1="914" y1="0" x2="914" y2="460"/>
  </g>

  <!-- column divider -->
  <line class="divider" x1="480" y1="0" x2="480" y2="460"/>

  <!-- Left: horizontal lockup -->
  <text class="label" x="46" y="30">[horizontal lockup]</text>
  <g transform="translate(80, 220)">
    <text class="mark" x="0" y="0" font-size="42">[hb]</text>
    <text class="qualifier" x="50" y="24" font-size="16" text-anchor="middle">[ai]</text>
    <text class="word" x="130" y="-6" font-size="38">Henry Benton</text>
    <text class="tagline" x="130" y="22" font-size="15">practical tools, built with ai</text>
  </g>

  <!-- Right, top: stacked lockup -->
  <text class="label" x="526" y="30">[stacked lockup]</text>
  <g transform="translate(660, 150)" text-anchor="middle">
    <text class="mark" x="0" y="0" font-size="42" text-anchor="middle">[hb]</text>
    <text class="qualifier" x="0" y="24" font-size="16" text-anchor="middle">[ai]</text>
    <text class="word" x="0" y="66" font-size="30" text-anchor="middle">Henry Benton</text>
    <text class="tagline" x="0" y="90" font-size="13" text-anchor="middle">practical tools, built with ai</text>
  </g>

  <!-- Right, bottom: mark only, for favicon / social avatar -->
  <text class="label" x="526" y="260">[mark only — favicon, social avatar]</text>
  <g transform="translate(660, 355)">
    <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="#C6BEA6" stroke-width="1" rx="3"/>
    <text class="mark" x="0" y="-4" font-size="34" text-anchor="middle">[hb]</text>
    <text class="qualifier" x="0" y="18" font-size="13" text-anchor="middle">[ai]</text>
  </g>

</svg>
